<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>لوحة أثر</title>
<style>:root{--ink:#2b1d14;--line:#cdbf9f;--bg:#f1e8d4}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:16px}
input,select,textarea,button{font:inherit;padding:7px;border:1px solid var(--line);background:#fbf7ec;border-radius:2px}button{cursor:pointer;background:var(--ink);color:var(--bg)}button.o{background:none;color:var(--ink)}
.t{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.card{border:1px solid var(--line);padding:12px;margin:8px 0;background:#f7f0e0}.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.st div{border:1px solid var(--line);padding:8px;text-align:center}
form{display:grid;gap:8px;max-width:520px}.er{color:#b5593c}</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.anon),app=document.getElementById('app'),$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={new:'طلب جديد',confirmed:'تم التأكيد',preparing:'قيد التجهيز',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغي'},LB={single:'نسخة واحدة',limited:'كمية محدودة',regular:'عادي'};
let tab='orders',O=[],P=[],C=[],K=[];
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data}=await sb.from('admins').select('user_id').maybeSingle();if(!data){app.innerHTML='<p class="er">هذا الحساب ليس مديراً.</p><button onclick="out()">خروج</button>';return}show()}
function login(m=''){app.innerHTML=`<h2>دخول المدير</h2><form onsubmit="in_(event)"><input name="em" type="email" placeholder="البريد" required><input name="pw" type="password" placeholder="كلمة المرور" required><p class="er">${m}</p><button>دخول</button></form>`}
async function in_(ev){ev.preventDefault();const f=new FormData(ev.target),{error}=await sb.auth.signInWithPassword({email:f.get('em'),password:f.get('pw')});error?login('بيانات غير صحيحة'):init()}
async function out(){await sb.auth.signOut();login()}
async function show(){const[o,p,c,k]=await Promise.all([sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}),sb.from('products').select('*,product_sizes(size,qty)').order('sort'),sb.from('collections').select('*').order('number'),sb.from('categories').select('*').order('sort')]);
 O=o.data||[];P=p.data||[];C=c.data||[];K=k.data||[];render()}
const n=s=>O.filter(o=>o.status==s).length,sold=P.filter(p=>p.product_sizes.every(s=>s.qty==0)).length;
function render(){const sold=P.filter(p=>p.product_sizes.every(s=>s.qty==0)).length,sales=O.filter(o=>o.status!='cancelled').reduce((a,o)=>a+o.total,0);
 app.innerHTML=`<div class="t"><b>لوحة أثر</b><button class="o" onclick="tab='orders';render()">الطلبات</button><button class="o" onclick="tab='products';render()">المنتجات</button><button class="o" onclick="tab='cols';render()">المجموعات</button><button class="o" onclick="out()">خروج</button></div>
 <div class="st"><div>الطلبات<br><b>${O.length}</b></div><div>جديدة<br><b>${n('new')}</b></div><div>مكتملة<br><b>${n('completed')}</b></div><div>ملغية<br><b>${n('cancelled')}</b></div><div>المبيعات<br><b>${sales.toLocaleString('ar-IQ')}</b></div><div>متوفرة<br><b>${P.length-sold}</b></div><div>نفذت<br><b>${sold}</b></div></div><div id="b"></div>`;
 ({orders:rOrders,products:rProd,cols:rCols})[tab]()}
function rOrders(q=''){$('#b').innerHTML=`<p><input placeholder="بحث: رقم / اسم / هاتف" oninput="rOrders(this.value)" value="${e(q)}"></p>`+O.filter(o=>!q||[o.number,o.name,o.phone].join(' ').includes(q)).map(o=>`<div class="card"><b>#${o.number}</b> ${e(o.name)} · ${e(o.phone)} · ${new Date(o.created_at).toLocaleString('ar-IQ')}<br>${e(o.governorate)} — ${e(o.district)} — ${e(o.address)}${o.notes?'<br>ملاحظة: '+e(o.notes):''}<br>${o.order_items.map(i=>`${e(i.product_name)} (${e(i.size)}) × ${i.qty} = ${(i.price*i.qty).toLocaleString('ar-IQ')}`).join('<br>')}<br>توصيل ${o.delivery_fee} · <b>الإجمالي ${o.total.toLocaleString('ar-IQ')} IQD</b><br><select onchange="setSt('${o.id}',this.value)" ${o.status=='cancelled'?'disabled':''}>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==o.status?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}
async function setSt(id,s){if(s=='cancelled'&&!confirm('الإلغاء يعيد المخزون ولا يمكن التراجع عنه. متأكد؟'))return show();const{error}=await sb.from('orders').update({status:s}).eq('id',id);if(error)alert(error.message);show()}
function rProd(){$('#b').innerHTML=`<h3>منتج</h3><form id="pf" onsubmit="saveP(event)"><input type="hidden" name="id"><input type="hidden" name="images"><input name="name" placeholder="الاسم" required><textarea name="description" placeholder="الوصف"></textarea><input name="price" type="number" min="0" placeholder="السعر IQD" required>
 <select name="category_id"><option value="">— الصنف —</option>${K.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('')}</select><select name="collection_id"><option value="">— المجموعة —</option>${C.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('')}</select>
 <select name="label">${Object.entries(LB).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input name="sizes" placeholder="المقاسات والكميات: S:1, M:2, L:0"><input name="sort" type="number" placeholder="الترتيب" value="0"><label><input type="checkbox" name="featured"> مميز</label><label><input type="checkbox" name="published"> منشور</label><input type="file" name="files" multiple accept="image/*"><small id="im"></small><p class="er" id="pm"></p><button>حفظ</button></form><button class="o" onclick="cat_()">+ صنف جديد</button><hr>`+
 P.map(p=>`<div class="card"><b>${e(p.name)}</b> · ${p.price} · ${p.published?'منشور':'مخفي'} · ${p.product_sizes.map(s=>s.size+':'+s.qty).join(' ')}<br><button class="o" onclick="editP('${p.id}')">تعديل</button> <button class="o" onclick="delP('${p.id}')">حذف</button></div>`).join('')}
function editP(id){const p=P.find(x=>x.id==id),f=$('#pf');for(const k of['id','name','description','price','category_id','collection_id','label','sort'])f[k].value=p[k]??'';f.images.value=JSON.stringify(p.images);f.sizes.value=p.product_sizes.map(s=>s.size+':'+s.qty).join(', ');f.featured.checked=p.featured;f.published.checked=p.published;$('#im').textContent=p.images.length+' صور محفوظة (رفع صور جديدة يضيف عليها)';scrollTo(0,0)}
async function saveP(ev){ev.preventDefault();const f=ev.target,m=$('#pm');m.textContent='جارٍ الحفظ…';try{
 const imgs=JSON.parse(f.images.value||'[]');for(const [i,file] of[...f.files.files].entries()){const path=`${Date.now()}-${i}-${file.name.replace(/[^\w.]/g,'')}`,{error}=await sb.storage.from('products').upload(path,file);if(error)throw error;imgs.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl)}
 const row={name:f.name.value,description:f.description.value,price:+f.price.value,category_id:+f.category_id.value||null,collection_id:+f.collection_id.value||null,images:imgs,label:f.label.value,featured:f.featured.checked,published:f.published.checked,sort:+f.sort.value||0};
 let id=f.id.value;if(id){const{error}=await sb.from('products').update(row).eq('id',id);if(error)throw error}else{const{data,error}=await sb.from('products').insert(row).select().single();if(error)throw error;id=data.id}
 const sz=f.sizes.value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b]=s.split(':');return{product_id:id,size:a.trim(),qty:Math.max(0,parseInt(b)||0)}});
 await sb.from('product_sizes').delete().eq('product_id',id);if(sz.length){const{error}=await sb.from('product_sizes').insert(sz);if(error)throw error}show()}catch(x){m.textContent=x.message}}
async function delP(id){if(confirm('حذف المنتج نهائياً؟')){await sb.from('products').delete().eq('id',id);show()}}
async function cat_(){const n=prompt('اسم الصنف');if(n){await sb.from('categories').insert({name:n,sort:K.length+1});show()}}
function rCols(){$('#b').innerHTML=`<h3>مجموعة</h3><form onsubmit="saveC(event)"><input name="number" type="number" placeholder="الرقم" required><input name="name" placeholder="الاسم" required><textarea name="description" placeholder="الوصف"></textarea><input type="file" name="cover" accept="image/*"><label><input type="checkbox" name="visible"> منشورة</label><label><input type="checkbox" name="archived"> مؤرشفة</label><p class="er" id="cm"></p><button>إضافة</button></form>`+
 C.map(c=>`<div class="card">${c.number} · ${e(c.name)} · ${c.visible?'منشورة':'مخفية'} ${c.archived?'· مؤرشفة':''}<br><button class="o" onclick="togC(${c.id},'visible',${!c.visible})">${c.visible?'إخفاء':'نشر'}</button> <button class="o" onclick="togC(${c.id},'archived',${!c.archived})">${c.archived?'إلغاء الأرشفة':'أرشفة'}</button> <button class="o" onclick="delC(${c.id})">حذف</button><br><small>لإضافة/إزالة منتجات: عدّل المنتج واختر المجموعة.</small></div>`).join('')}
async function saveC(ev){ev.preventDefault();const f=ev.target;try{let cover_url=null;if(f.cover.files[0]){const file=f.cover.files[0],path=`cover-${Date.now()}-${file.name.replace(/[^\w.]/g,'')}`,{error}=await sb.storage.from('products').upload(path,file);if(error)throw error;cover_url=sb.storage.from('products').getPublicUrl(path).data.publicUrl}
 const{error}=await sb.from('collections').insert({number:+f.number.value,name:f.name.value,description:f.description.value,cover_url,visible:f.visible.checked,archived:f.archived.checked});if(error)throw error;show()}catch(x){$('#cm').textContent=x.message}}
async function togC(id,k,v){await sb.from('collections').update({[k]:v}).eq('id',id);show()}
async function delC(id){if(confirm('حذف المجموعة؟')){await sb.from('collections').delete().eq('id',id);show()}}
init();
</script></body></html>
